<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PPai</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #212121;
            --sidebar: #171717;
            --sidebar-hover: #2a2a2a;
            --input: #2f2f2f;
            --border: #3f3f3f;
            --text: #ececec;
            --muted: #9b9b9b;
            --green: #10a37f;
            --code: #111111;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
        }

        /* =========================
           APP
        ========================= */

        .app {
            width: 100%;
            height: 100%;
            display: flex;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 260px;
            height: 100%;
            background: var(--sidebar);

            display: flex;
            flex-direction: column;

            padding: 8px;

            flex-shrink: 0;

            transition:
                width .2s ease,
                padding .2s ease;
        }

        .sidebar.hidden {
            width: 0;
            padding: 0;
            overflow: hidden;
        }

        .brand {
            height: 48px;

            display: flex;
            align-items: center;

            gap: 10px;

            padding: 0 10px;
        }

        .logo {
            width: 32px;
            height: 32px;

            border-radius: 9px;

            background: var(--green);

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-weight: 800;
            font-size: 16px;
        }

        .brand-name {
            font-size: 17px;
            font-weight: 600;
        }

        .new-chat {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 10px;

            padding: 11px 12px;

            margin: 4px 0 15px;

            border-radius: 8px;

            background: transparent;
            color: var(--text);

            cursor: pointer;

            text-align: left;
        }

        .new-chat:hover {
            background: var(--sidebar-hover);
        }

        .history-title {
            padding: 8px 12px;

            color: #777;

            font-size: 12px;
            font-weight: 600;
        }

        .history {
            flex: 1;
            overflow-y: auto;
        }

        .history-item {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 9px;

            padding: 10px 12px;

            border-radius: 7px;

            background: transparent;
            color: #d0d0d0;

            cursor: pointer;

            text-align: left;

            overflow: hidden;
        }

        .history-item:hover {
            background: var(--sidebar-hover);
        }

        .history-item-text {
            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }

        .sidebar-bottom {
            border-top: 1px solid #292929;

            padding-top: 8px;
        }

        .account {
            display: flex;
            align-items: center;

            gap: 10px;

            padding: 10px 12px;

            border-radius: 8px;
        }

        .avatar {
            width: 30px;
            height: 30px;

            border-radius: 50%;

            background: #555;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 600;
        }

        .account-name {
            font-size: 14px;
            font-weight: 600;
        }

        .account-sub {
            color: var(--muted);
            font-size: 11px;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;

            min-width: 0;

            height: 100%;

            display: flex;
            flex-direction: column;

            position: relative;
        }

        .topbar {
            height: 56px;

            display: flex;
            align-items: center;

            padding: 0 14px;

            flex-shrink: 0;
        }

        .menu {
            width: 38px;
            height: 38px;

            border-radius: 8px;

            background: transparent;
            color: var(--text);

            cursor: pointer;

            font-size: 20px;
        }

        .menu:hover {
            background: #2a2a2a;
        }

        .mobile-title {
            display: none;

            margin-left: 8px;

            font-weight: 600;
        }

        /* =========================
           CHAT
        ========================= */

        .chat {
            flex: 1;

            overflow-y: auto;

            scroll-behavior: smooth;
        }

        .chat-inner {
            width: min(820px, calc(100% - 32px));

            margin: 0 auto;

            padding: 20px 0 180px;
        }

        /* =========================
           WELCOME
        ========================= */

        .welcome {
            min-height: calc(100vh - 230px);

            display: flex;
            align-items: center;
            justify-content: center;

            flex-direction: column;

            text-align: center;

            padding: 20px;
        }

        .welcome-logo {
            width: 58px;
            height: 58px;

            border-radius: 16px;

            background: var(--green);

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 26px;
            font-weight: 800;

            margin-bottom: 18px;
        }

        .welcome h1 {
            margin: 0 0 8px;

            font-size: 30px;
            font-weight: 600;
        }

        .welcome p {
            margin: 0;

            color: var(--muted);
        }

        .suggestions {
            width: min(700px, 100%);

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin-top: 28px;
        }

        .suggestion {
            padding: 15px;

            text-align: left;

            border:
                1px solid #353535;

            border-radius: 10px;

            background: #292929;
            color: #ddd;

            cursor: pointer;
        }

        .suggestion:hover {
            background: #333;
        }

        .suggestion-title {
            margin-bottom: 5px;

            font-size: 14px;
            font-weight: 600;
        }

        .suggestion-text {
            color: #999;

            font-size: 12px;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: flex;

            gap: 16px;

            margin-bottom: 30px;
        }

        .message-avatar {
            width: 32px;
            height: 32px;

            flex-shrink: 0;

            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 13px;
            font-weight: 700;
        }

        .message.user .message-avatar {
            background: #555;
        }

        .message.ai .message-avatar {
            background: var(--green);
        }

        .message-content {
            flex: 1;

            min-width: 0;

            font-size: 15px;

            line-height: 1.65;

            overflow-wrap: anywhere;
        }

        .message-text {
            white-space: normal;
        }

        /* =========================
           CODE
        ========================= */

        .code-box {
            width: 100%;

            margin: 14px 0;

            border:
                1px solid #3b3b3b;

            border-radius: 9px;

            overflow: hidden;

            background: var(--code);
        }

        .code-head {
            min-height: 38px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            padding:
                5px 10px 5px 14px;

            background: #2b2b2b;

            color: #aaa;

            font-size: 12px;
        }

        .code-actions {
            display: flex;

            gap: 6px;
        }

        .code-btn {
            padding: 5px 9px;

            border-radius: 5px;

            background: #3a3a3a;

            color: #ddd;

            cursor: pointer;

            font-size: 11px;
        }

        .code-btn:hover {
            background: #4a4a4a;
        }

        .code-btn:active {
            transform: scale(.97);
        }

        .code-content {
            margin: 0;

            padding: 15px;

            overflow-x: auto;

            color: #ddd;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 13px;

            line-height: 1.6;

            white-space: pre;
        }

        /* =========================
           INPUT
        ========================= */

        .input-area {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding:
                20px 16px 24px;

            background:
                linear-gradient(
                    transparent,
                    var(--bg) 25%
                );
        }

        .input-container {
            width: min(820px, 100%);

            margin: auto;
        }

        .input-box {
            display: flex;
            align-items: flex-end;

            gap: 7px;

            padding:
                10px 10px 10px 14px;

            background: var(--input);

            border:
                1px solid #444;

            border-radius: 16px;
        }

        #input {
            flex: 1;

            min-height: 26px;
            max-height: 180px;

            resize: none;

            overflow-y: auto;

            outline: none;

            border: 0;

            background: transparent;

            color: var(--text);

            font-size: 15px;

            line-height: 1.5;

            padding: 5px 0;
        }

        #input::placeholder {
            color: #999;
        }

        .input-button {
            width: 34px;
            height: 34px;

            flex-shrink: 0;

            border-radius: 9px;

            background: transparent;

            color: #aaa;

            cursor: pointer;

            font-size: 17px;
        }

        .input-button:hover {
            background: #444;

            color: white;
        }

        .send {
            background: #555;

            color: white;
        }

        .send.active {
            background: white;

            color: black;
        }

        .disclaimer {
            margin-top: 9px;

            text-align: center;

            color: #777;

            font-size: 11px;
        }

        /* =========================
           TERMINAL
        ========================= */

        .terminal {
            display: none;

            margin-top: 10px;

            border:
                1px solid #3b3b3b;

            border-radius: 9px;

            overflow: hidden;

            background: #111;
        }

        .terminal.show {
            display: block;
        }

        .terminal-head {
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 12px;

            background: #292929;

            font-size: 12px;
        }

        .terminal-output {
            padding: 12px;

            max-height: 220px;

            overflow: auto;

            white-space: pre-wrap;

            font-family:
                Consolas,
                monospace;

            font-size: 12px;

            color: #bbb;
        }

        /* =========================
           SCROLLBAR
        ========================= */

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #444;

            border-radius: 10px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .sidebar {
                position: fixed;

                z-index: 100;

                left: 0;
                top: 0;
                bottom: 0;

                box-shadow:
                    8px 0 30px
                    rgba(0, 0, 0, .4);
            }

            .mobile-title {
                display: block;
            }

            .chat-inner {
                width:
                    calc(100% - 24px);
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .message {
                gap: 10px;
            }

            .message-content {
                font-size: 14px;
            }

            .input-area {
                padding-left: 10px;
                padding-right: 10px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="brand">

            <div class="logo">
                P
            </div>

            <div class="brand-name">
                PPai
            </div>

        </div>

        <button
            class="new-chat"
            onclick="newChat()"
        >

            <span>＋</span>

            <span>
                Chat mới
            </span>

        </button>

        <div class="history-title">
            Lịch sử
        </div>

        <div
            class="history"
            id="history"
        ></div>

        <div class="sidebar-bottom">

            <div class="account">

                <div class="avatar">
                    P
                </div>

                <div>

                    <div class="account-name">
                        PPai
                    </div>

                    <div class="account-sub">
                        Python AI
                    </div>

                </div>

            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <button
                class="menu"
                onclick="toggleSidebar()"
                title="Menu"
            >
                ☰
            </button>

            <div class="mobile-title">
                PPai
            </div>

        </header>


        <!-- CHAT -->

        <section
            class="chat"
            id="chat"
        >

            <div
                class="chat-inner"
                id="chatInner"
            >

                <!-- WELCOME -->

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-logo">
                        P
                    </div>

                    <h1>
                        PPai
                    </h1>

                    <p>
                        AI lập trình Python của bạn
                    </p>


                    <div class="suggestions">

                        <button
                            class="suggestion"
                            onclick="suggest(
                                'Viết cho tôi một chương trình Python tính toán cơ bản'
                            )"
                        >

                            <div class="suggestion-title">
                                Viết code Python
                            </div>

                            <div class="suggestion-text">
                                Tạo chương trình từ mô tả
                            </div>

                        </button>


                        <button
                            class="suggestion"
                            onclick="suggest(
                                'Giải thích Python cho tôi'
                            )"
                        >

                            <div class="suggestion-title">
                                Học Python
                            </div>

                            <div class="suggestion-text">
                                Giải thích lập trình dễ hiểu
                            </div>

                        </button>


                        <button
                            class="suggestion"
                            onclick="suggest(
                                'Sửa lỗi code Python của tôi'
                            )"
                        >

                            <div class="suggestion-title">
                                Sửa lỗi
                            </div>

                            <div class="suggestion-text">
                                Phân tích lỗi trong code
                            </div>

                        </button>


                        <button
                            class="suggestion"
                            onclick="suggest(
                                'Tạo game đoán số bằng Python'
                            )"
                        >

                            <div class="suggestion-title">
                                Tạo game
                            </div>

                            <div class="suggestion-text">
                                Bắt đầu một project Python
                            </div>

                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-container">

                <div class="input-box">

                    <button
                        class="input-button"
                        onclick="insertTemplate()"
                        title="Thêm code"
                    >
                        +
                    </button>


                    <textarea
                        id="input"
                        rows="1"
                        placeholder="Nhắn tin với PPai..."
                    ></textarea>


                    <button
                        class="input-button send"
                        id="send"
                        onclick="sendMessage()"
                        title="Gửi"
                    >
                        ↑
                    </button>

                </div>


                <!-- TERMINAL -->

                <div
                    class="terminal"
                    id="terminal"
                >

                    <div class="terminal-head">

                        <span>
                            Python
                        </span>

                        <button
                            class="code-btn"
                            onclick="closeTerminal()"
                        >
                            Đóng
                        </button>

                    </div>

                    <div
                        class="terminal-output"
                        id="terminalOutput"
                    ></div>

                </div>


                <div class="disclaimer">
                    PPai có thể mắc lỗi. Hãy kiểm tra code trước khi chạy.
                </div>

            </div>

        </div>

    </main>

</div>


<script>
/* =====================================================
   PPai Frontend
   GitHub Pages compatible
   ===================================================== */


/* =========================
   ELEMENTS
========================= */

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const sidebar =
    document.getElementById("sidebar");

const historyBox =
    document.getElementById("history");


/* =========================
   STATE
========================= */

let currentCode = "";


/* =========================
   SIDEBAR
========================= */

function toggleSidebar() {

    sidebar.classList.toggle(
        "hidden"
    );
}


/* =========================
   NEW CHAT
========================= */

function newChat() {

    currentCode = "";

    chatInner.innerHTML = createWelcome();

    input.value = "";

    closeTerminal();

    autoResize();

    updateSend();

    chat.scrollTop = 0;
}


/* =========================
   WELCOME HTML
========================= */

function createWelcome() {

    return `
        <div
            class="welcome"
            id="welcome"
        >

            <div class="welcome-logo">
                P
            </div>

            <h1>
                PPai
            </h1>

            <p>
                AI lập trình Python của bạn
            </p>

            <div class="suggestions">

                <button
                    class="suggestion"
                    onclick="suggest(
                        'Viết cho tôi một chương trình Python tính toán cơ bản'
                    )"
                >

                    <div class="suggestion-title">
                        Viết code Python
                    </div>

                    <div class="suggestion-text">
                        Tạo chương trình từ mô tả
                    </div>

                </button>


                <button
                    class="suggestion"
                    onclick="suggest(
                        'Giải thích Python cho tôi'
                    )"
                >

                    <div class="suggestion-title">
                        Học Python
                    </div>

                    <div class="suggestion-text">
                        Giải thích lập trình dễ hiểu
                    </div>

                </button>


                <button
                    class="suggestion"
                    onclick="suggest(
                        'Sửa lỗi code Python của tôi'
                    )"
                >

                    <div class="suggestion-title">
                        Sửa lỗi
                    </div>

                    <div class="suggestion-text">
                        Phân tích lỗi trong code
                    </div>

                </button>


                <button
                    class="suggestion"
                    onclick="suggest(
                        'Tạo game đoán số bằng Python'
                    )"
                >

                    <div class="suggestion-title">
                        Tạo game
                    </div>

                    <div class="suggestion-text">
                        Bắt đầu một project Python
                    </div>

                </button>

            </div>

        </div>
    `;
}


/* =========================
   SUGGESTION
========================= */

function suggest(text) {

    input.value = text;

    autoResize();

    updateSend();

    sendMessage();
}


/* =========================
   SEND MESSAGE
========================= */

function sendMessage() {

    const text =
        input.value.trim();

    if (!text) {
        return;
    }


    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {
        welcome.remove();
    }


    addMessage(
        "user",
        createTextHTML(text)
    );


    addHistory(text);


    input.value = "";

    autoResize();

    updateSend();


    setTimeout(
        function() {

            const result =
                localAI(
                    text,
                    currentCode
                );

            addAIMessage(result);

        },
        300
    );
}


/* =========================
   USER MESSAGE
========================= */

function createTextHTML(text) {

    return `
        <div class="message-text">
            ${escapeHTML(text)
                .replace(/\n/g, "<br>")}
        </div>
    `;
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
    type,
    content
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    message.innerHTML = `
        <div class="message-avatar">
            ${type === "user" ? "U" : "P"}
        </div>

        <div class="message-content">
            ${content}
        </div>
    `;


    chatInner.appendChild(
        message
    );


    scrollBottom();
}


/* =========================
   ADD AI MESSAGE
========================= */

function addAIMessage(result) {

    let html = "";


    if (result.text) {

        html += `
            <div class="message-text">
                ${escapeHTML(result.text)
                    .replace(/\n/g, "<br>")}
            </div>
        `;
    }


    if (result.code) {

        html += createCodeBlock(
            result.code
        );
    }


    addMessage(
        "ai",
        html
    );
}


/* =========================
   CODE BLOCK
========================= */

function createCodeBlock(code) {

    const encoded =
        encodeURIComponent(code);


    return `
        <div
            class="code-box"
            data-code="${encoded}"
        >

            <div class="code-head">

                <span>
                    python
                </span>

                <div class="code-actions">

                    <button
                        type="button"
                        class="code-btn"
                        onclick="copyCode(this)"
                    >
                        Copy
                    </button>


                    <button
                        type="button"
                        class="code-btn"
                        onclick="runCode(this)"
                    >
                        ▶ Chạy
                    </button>

                </div>

            </div>


            <pre
                class="code-content"
            >${escapeHTML(code)}</pre>

        </div>
    `;
}


/* =========================
   COPY CODE
========================= */

function copyCode(button) {

    const box =
        button.closest(
            ".code-box"
        );

    if (!box) {
        return;
    }


    const code =
        decodeURIComponent(
            box.dataset.code
        );


    if (
        navigator.clipboard &&
        navigator.clipboard.writeText
    ) {

        navigator.clipboard
            .writeText(code)
            .then(
                function() {

                    const old =
                        button.textContent;

                    button.textContent =
                        "Đã copy";

                    setTimeout(
                        function() {
                            button.textContent =
                                old;
                        },
                        1500
                    );
                }
            );

        return;
    }


    /* fallback */

    const area =
        document.createElement(
            "textarea"
        );

    area.value = code;

    document.body.appendChild(
        area
    );

    area.select();

    document.execCommand(
        "copy"
    );

    area.remove();


    button.textContent =
        "Đã copy";

    setTimeout(
        function() {
            button.textContent =
                "Copy";
        },
        1500
    );
}


/* =========================
   RUN CODE
========================= */

function runCode(button) {

    const box =
        button.closest(
            ".code-box"
        );

    if (!box) {
        return;
    }


    const code =
        decodeURIComponent(
            box.dataset.code
        );


    const terminal =
        document.getElementById(
            "terminal"
        );

    const output =
        document.getElementById(
            "terminalOutput"
        );


    terminal.classList.add(
        "show"
    );


    output.textContent =
`PPai > Python

Đã nhận code:

${code}

--------------------------------

GitHub Pages không thể thực thi
Python trực tiếp.

server.py + ai.py cần chạy trên

/* =========================
   HISTORY
========================= */

function addHistory(title) {

    const item =
        document.createElement(
            "button"
        );

    item.className =
        "history-item";


    const icon =
        document.createElement(
            "span"
        );

    icon.textContent =
        "💬";


    const text =
        document.createElement(
            "span"
        );

    text.className =
        "history-item-text";

    text.textContent =
        title;


    item.appendChild(
        icon
    );

    item.appendChild(
        text
    );


    item.onclick =
        function() {

            input.value =
                title;

            autoResize();

            updateSend();

            input.focus();
        };


    historyBox.prepend(
        item
    );


    while (
        historyBox.children.length > 30
    ) {

        historyBox.removeChild(
            historyBox.lastChild
        );
    }
}

/* =========================
   AUTO RESIZE
========================= */

function autoResize() {

    input.style.height =
        "auto";


    input.style.height =
        Math.min(
            input.scrollHeight,
            180
        ) + "px";
}


/* =========================
   SEND STATE
========================= */

function updateSend() {

    if (
        input.value.trim()
    ) {

        send.classList.add(
            "active"
        );

    } else {

        send.classList.remove(
            "active"
        );
    }
}

/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================
   CTRL + K
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "k"
        ) {

            event.preventDefault();

            input.focus();
        }
    }
);
